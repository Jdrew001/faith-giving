name: Prod

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/faith-giving-api
  IMAGE_UI: ghcr.io/${{ github.repository_owner }}/faith-giving-ui

jobs:
  # ── 1. Detect what changed ─────────────────────────────────────────────────
  affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      ui: ${{ steps.check.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Check affected projects
        id: check
        run: |
          AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD)
          echo "Affected: $AFFECTED"
          echo "api=$(echo $AFFECTED | grep -c 'faith-giving-api')" >> $GITHUB_OUTPUT
          echo "ui=$(echo $AFFECTED | grep -c 'faith-giving-ui')"   >> $GITHUB_OUTPUT

  # ── 2. Build & push Docker images ─────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: affected
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no secret needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        if: needs.affected.outputs.api == '1'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/faith-giving-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI image
        if: needs.affected.outputs.ui == '1'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/faith-giving-ui/Dockerfile
          push: true
          tags: ${{ env.IMAGE_UI }}:latest,${{ env.IMAGE_UI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to production server ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production        # enables environment protection rules in GitHub
    steps:
      - name: Set up SSH
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_ed25519
          chmod 600 $HOME/.ssh/id_ed25519
          ssh-keyscan -t ed25519 ${{ secrets.HOST }} >> $HOME/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /root/projects/faith-giving

            # Export image tags so docker-compose pulls the right images
            export API_IMAGE=${{ env.IMAGE_API }}:latest
            export UI_IMAGE=${{ env.IMAGE_UI }}:latest

            # Pull latest images (only updated ones are re-pulled)
            sudo -E docker compose pull

            # Restart containers with zero-downtime rolling update
            sudo -E docker compose up -d --remove-orphans

            # Clean up old dangling images to free disk space
            sudo docker image prune -f
