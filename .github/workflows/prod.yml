name: Prod

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. Detect what changed ─────────────────────────────────────────────────
  affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      ui: ${{ steps.check.outputs.ui }}
      image_api: ${{ steps.images.outputs.image_api }}
      image_ui: ${{ steps.images.outputs.image_ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Compute lowercase image names
        id: images
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_api=${{ env.REGISTRY }}/${OWNER_LC}/faith-giving-api" >> $GITHUB_OUTPUT
          echo "image_ui=${{ env.REGISTRY }}/${OWNER_LC}/faith-giving-ui"   >> $GITHUB_OUTPUT

      - name: Check affected projects
        id: check
        run: |
          AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD)
          echo "Affected: $AFFECTED"
          echo "api=$(echo $AFFECTED | grep -c 'faith-giving-api')" >> $GITHUB_OUTPUT
          echo "ui=$(echo $AFFECTED | grep -c 'faith-giving-ui')"   >> $GITHUB_OUTPUT

  # ── 2. Build & push Docker images ─────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: affected
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no secret needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        if: needs.affected.outputs.api == '1'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/faith-giving-api/Dockerfile
          push: true
          tags: ${{ needs.affected.outputs.image_api }}:latest,${{ needs.affected.outputs.image_api }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI image
        if: needs.affected.outputs.ui == '1'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/faith-giving-ui/Dockerfile
          push: true
          tags: ${{ needs.affected.outputs.image_ui }}:latest,${{ needs.affected.outputs.image_ui }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to production server ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [affected, build]
    environment: production        # enables environment protection rules in GitHub
    steps:
      - name: Set up SSH
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_ed25519
          chmod 600 $HOME/.ssh/id_ed25519
          ssh-keyscan -t ed25519 ${{ secrets.HOST }} >> $HOME/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: API_IMAGE,UI_IMAGE
          script: |
            set -ex
            echo "::group::Environment"
            whoami
            hostname
            pwd
            echo "::endgroup::"

            echo "::group::cd to project"
            cd /home/teamcity/projects/faith-giving
            ls -la
            echo "::endgroup::"

            # Image tags exported via `envs` above
            export API_IMAGE=${{ needs.affected.outputs.image_api }}:latest
            export UI_IMAGE=${{ needs.affected.outputs.image_ui }}:latest
            echo "API_IMAGE=$API_IMAGE"
            echo "UI_IMAGE=$UI_IMAGE"

            echo "::group::docker compose pull"
            sudo -E docker compose pull
            echo "::endgroup::"

            echo "::group::docker compose up"
            sudo -E docker compose up -d --remove-orphans
            echo "::endgroup::"

            echo "::group::docker image prune"
            sudo docker image prune -f
            echo "::endgroup::"

            echo "✅ Deploy succeeded"
