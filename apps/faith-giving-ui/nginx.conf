server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare root to /give/ for convenience when hitting the container directly
    location = / {
        return 302 /give/;
    }

    # Angular app served under /give/ to match production base href.
    # The `^~` ensures this prefix wins over any regex locations below,
    # so static assets under /give/ are correctly served from the html root.
    location ^~ /give/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /give/index.html;

        # Cache hashed Angular assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
