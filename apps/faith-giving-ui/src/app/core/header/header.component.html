<ng-container *ngIf="experience.enabled; else legacy">
<header class="app-header">
  <div class="header-inner">
    <a class="header-brand" routerLink="/" aria-label="Faith Giving home">
      <span class="brand-text">Faith Giving</span>
    </a>
    <nav class="header-actions" aria-label="Main navigation">
      <ng-container *ngIf="authService.isAuthenticated; else signIn">
        <button
          class="header-avatar"
          type="button"
          (click)="onAvatarClick()"
          aria-label="Edit your profile"
        >
          <span class="avatar-initials">{{ initials }}</span>
        </button>
        <button
          class="text-button sign-out"
          type="button"
          (click)="authService.signOut()"
        >
          Sign out
        </button>
      </ng-container>
      <ng-template #signIn>
        <a class="sign-in-link" routerLink="/"
          ><i class="pi pi-user" aria-hidden="true"></i> Sign in</a
        >
      </ng-template>
    </nav>
  </div>
</header>

</ng-container>

<!-- Preserve the existing experience when beta_access is unavailable or off. -->
<ng-template #legacy>
<header class="app-header">
  <div class="header-inner">
    <div class="header-brand">
      <span class="brand-text">Faith Giving</span>
    </div>
    <div class="header-avatar" (click)="onAvatarClick()" [class.authenticated]="authService.isAuthenticated">
      <span *ngIf="authService.isAuthenticated; else guestIcon" class="avatar-initials">{{ initials }}</span>
      <ng-template #guestIcon><i class="pi pi-user"></i></ng-template>
    </div>
  </div>
</header>

</ng-template>
