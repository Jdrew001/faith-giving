<header class="app-header">
  <div class="header-inner">
    <a
      class="header-brand"
      href="./"
      (click)="$event.preventDefault(); showHome()"
      aria-label="Faith Giving home"
    >
      <span class="brand-text">Faith Giving</span>
    </a>
    <nav class="header-actions" aria-label="Main navigation">
      <ng-container *ngIf="authService.isAuthenticated; else signIn">
        <button
          class="header-avatar"
          type="button"
          (click)="onAvatarClick()"
          aria-label="Edit your profile"
        >
          <span class="avatar-initials">{{ initials }}</span>
        </button>
        <button
          class="text-button sign-out"
          type="button"
          (click)="authService.signOut()"
        >
          Sign out
        </button>
      </ng-container>
      <ng-template #signIn>
        <a
          class="sign-in-link"
          href="./"
          (click)="$event.preventDefault(); flow.showSignIn()"
          ><i class="pi pi-user" aria-hidden="true"></i> Sign in</a
        >
      </ng-template>
    </nav>
  </div>
</header>
