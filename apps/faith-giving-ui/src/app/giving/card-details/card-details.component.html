<div class="field-group">
    <label class="field-label">Card Number</label>
    <p-skeleton *ngIf="!cardLoaded" width="100%" height="2.75rem"></p-skeleton>
    <div #numberElement class="input form-control stripe-element" id="numberElement" [ngStyle]="{'opacity': !cardLoaded ? '0' : '1'}"></div>
    <p class="error" *ngIf="cardErrors?.error && formSubmitted">{{ cardErrors?.error?.message }}</p>
    <p class="error" *ngIf="cardErrors?.empty && formSubmitted">{{ cardErrors?.empty?.message }}</p>
</div>

<div class="field-group">
    <label class="field-label">Expiration</label>
    <p-skeleton *ngIf="!cvvLoaded" width="100%" height="2.75rem"></p-skeleton>
    <div #expElement class="input form-control stripe-element" id="expElement" [ngStyle]="{'opacity': !cvvLoaded ? '0' : '1'}"></div>
    <p class="error" *ngIf="expErrors?.error && formSubmitted">{{ expErrors?.error?.message }}</p>
    <p class="error" *ngIf="expErrors?.empty && formSubmitted">{{ expErrors?.empty?.message }}</p>
</div>

<div class="field-group">
    <label class="field-label">CVC</label>
    <p-skeleton *ngIf="!expLoaded" width="100%" height="2.75rem"></p-skeleton>
    <div #cvvElement class="input form-control stripe-element" id="cvvElement" [ngStyle]="{'opacity': !expLoaded ? '0' : '1'}"></div>
    <p class="error" *ngIf="cvvErrors?.error && formSubmitted">{{ cvvErrors?.error?.message }}</p>
    <p class="error" *ngIf="cvvErrors?.empty && formSubmitted">{{ cvvErrors?.empty?.message }}</p>
</div>

<div class="field-group">
    <label class="field-label">Zip Code</label>
    <p-skeleton *ngIf="!expLoaded" width="100%" height="2.75rem"></p-skeleton>
    <input [(ngModel)]="zipCode" placeholder="ZIP CODE" class="form-control" type="number" max="5" [ngStyle]="{'opacity': !expLoaded ? '0' : '1'}">
    <p class="error" *ngIf="(zipCode === '') && formSubmitted">Please provide a zip code</p>
</div>

<button [disabled]="(!cardLoaded && !expLoaded && !cvvLoaded)" (click)="submit()" class="pay-button" type="button">
    <i class="pi pi-lock"></i> Pay with Stripe
</button>

<div class="back-row">
    <a (click)="backToPrevious()" class="back-link">
        <i class="pi pi-arrow-left"></i> Previous
    </a>
</div>
