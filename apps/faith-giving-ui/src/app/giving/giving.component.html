<div class="give-page" [formGroup]="givingForm">
    <div class="page-header">
        <h1>Online Giving</h1>
        <p>Securely give your tithes and offerings.</p>
    </div>

    <div class="card-wrapper" [ngSwitch]="activeFormIndex">
        <div class="giving-card">
            <div class="progress-bar">
                <div class="progress-fill" [style.width]="activeFormIndex === 0 ? '50%' : '100%'"></div>
            </div>

            <div class="card-container">
                <ng-container *ngSwitchCase="0">
                    <div class="section-header">
                        <h5>Your Details</h5>
                        <div *ngIf="userDetails && giveService.userEdit" class="cancel-action">
                            <a (click)="cancelEdit()" class="cancel-link">
                                <i class="pi pi-times"></i> Cancel
                            </a>
                        </div>
                    </div>

                    <ng-container *ngIf="userDetails && !giveService.userEdit">
                        <faith-giving-user-details-session
                            [userDetails]="giveService.individualInfo"
                            (editClicked$)="onEdit($event)"></faith-giving-user-details-session>
                    </ng-container>
                    <ng-container *ngIf="giveService.userEdit">
                        <faith-giving-user-details
                            [formSubmitted]="formSubmitted"
                            (onChange$)="userInputChange()"></faith-giving-user-details>
                    </ng-container>

                    <hr class="section-divider">

                    <faith-giving-giving-details [formSubmitted]="formSubmitted"></faith-giving-giving-details>

                    <hr class="section-divider">

                    <div class="fee-container">
                        <p-checkbox name="groupname" [binary]="true" formControlName="feeCovered" label="Help cover the card processing fee?"></p-checkbox>
                        <span class="fee-note">Total + (2.2% + $0.30)</span>
                    </div>

                    <div class="giving-total-row">
                        <span class="total-label">Giving Total:</span>
                        <span class="total-amount">{{giveTotal | currency}}</span>
                    </div>

                    <button (click)="payWithStripe()" class="pay-button" type="button">
                        <i class="pi pi-lock"></i> Pay with Stripe
                    </button>

                    <div class="clear-row">
                        <a (click)="clearFields()" class="clear-btn">Clear form</a>
                    </div>
                </ng-container>

                <ng-container *ngSwitchCase="1">
                    <div class="section-header">
                        <h5>Card Details</h5>
                    </div>

                    <faith-giving-card-details
                        [formSubmitted]="formSubmitted"
                        [stripe]="stripe"
                        (submit$)="submitForm($event)"
                        (backToPrevious$)="previous()"></faith-giving-card-details>
                </ng-container>
            </div>
        </div>
    </div>
</div>
<p-toast position="bottom-center"></p-toast>
<div *ngIf="requestInit" class="loader-overlay">
    <p-progressSpinner class="spinner"></p-progressSpinner>
</div>
<p-confirmDialog #confirmDialog
    [message]="'Are you sure you want to cancel?'"
    acceptLabel="Yes"
    rejectLabel="No"
    acceptButtonStyleClass="p-button-sm"
    rejectButtonStyleClass="p-button-sm"
    (acceptEvent)="onConfirm()"></p-confirmDialog>
